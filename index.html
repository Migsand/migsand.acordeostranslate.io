<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor AcordeOS</title>
    <link rel="icon" type="image/png" href="logo.png">

<link rel="apple-touch-icon" href="logo.png">

<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        oled: '#000000',
                        gray950: '#0a0a0a'
                    }
                }
            }
        }
    </script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; min-height: 100vh; background-color: #000000; color: #ffffff; color-scheme: dark; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #000000; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- ICONOS ---
        const ArrowRightIcon = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>;
        const ArrowDownIcon = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>;
        const CopyIcon = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>;
        const DownloadIcon = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>;
        const WandIcon = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72Z"/><path d="m14 7 3 3"/><path d="M5 6v4"/><path d="M19 14v4"/><path d="M10 2v2"/><path d="M7 8H3"/><path d="M21 16h-4"/><path d="M11 3H9"/></svg>;

        const DEFAULT_INPUT = `Intro:
G  D  Em  C

Coro:
   G             D
En el cielo de tu boca
      Em               C
me quedé a vivir sin aire`;

        function App() {
            const [songTitle, setSongTitle] = useState('Ejemplo de Canción');
            const [artist, setArtist] = useState('El Grupo');
            const [input, setInput] = useState(DEFAULT_INPUT);
            const [output, setOutput] = useState('');
            const [copied, setCopied] = useState(false);

            // Expresión regular para detectar acordes válidos
            const validChordRegex = /^([A-G][#b]?|DO|RE|MI|FA|SOL|LA|SI)(m|maj|min|dim|aug|sus|add|M)?\d*(\+|-)?((\/|-)[A-G][#b]?)?$/i;

            const isChordLine = (line) => {
                if (!line || line.trim() === '') return false;
                const words = line.trim().split(/\s+/);
                let validCount = 0;

                for(let word of words) {
                    let cleanWord = word.replace(/[\(\)\[\]\|]/g, '');
                    if (validChordRegex.test(cleanWord)) {
                        validCount++;
                    }
                }
                
                return (validCount / words.length) > 0.5;
            };

            const mergeChordAndLyric = (chordLine, lyricLine) => {
                const regex = /\S+/g;
                let match;
                const chords = [];
                
                while ((match = regex.exec(chordLine)) !== null) {
                    let word = match[0];
                    let cleanWord = word.replace(/[\(\)\[\]]/g, '');
                    if (validChordRegex.test(cleanWord)) {
                        chords.push({ text: cleanWord, index: match.index });
                    }
                }

                let result = lyricLine;
                const lastChordEnd = chords.length > 0 ? chords[chords.length - 1].index : 0;
                if (result.length < lastChordEnd) {
                    result = result.padEnd(lastChordEnd, ' ');
                }

                for (let i = chords.length - 1; i >= 0; i--) {
                    const { text, index } = chords[i];
                    result = result.slice(0, index) + `[${text}]` + result.slice(index);
                }

                return result.trimEnd();
            };

            const wrapChordsInLine = (line) => {
                return line.replace(/\S+/g, match => {
                    let clean = match.replace(/[\(\)\[\]]/g, '');
                    if (validChordRegex.test(clean)) {
                        return `[${clean}]`;
                    }
                    return match;
                });
            };

            const translateText = () => {
                const lines = input.split('\n');
                const outputLines = [];

                // Agregar metadatos de Título y Artista al inicio
                if (songTitle.trim()) outputLines.push(`Título: ${songTitle.trim()}`);
                if (artist.trim()) outputLines.push(`Artista: ${artist.trim()}`);
                if (songTitle.trim() || artist.trim()) outputLines.push(''); // Línea vacía separadora

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    
                    if (isChordLine(line)) {
                        const nextLine = (i + 1 < lines.length) ? lines[i + 1] : null;
                        
                        if (nextLine !== null && !isChordLine(nextLine) && nextLine.trim() !== '') {
                            const injected = mergeChordAndLyric(line, nextLine);
                            outputLines.push(injected);
                            i++; 
                        } else {
                            outputLines.push(wrapChordsInLine(line));
                        }
                    } else {
                        outputLines.push(line);
                    }
                }

                setOutput(outputLines.join('\n'));
            };

            const copyToClipboard = () => {
                const textArea = document.createElement("textarea");
                textArea.value = output;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                } catch (err) {
                    console.error('Error al copiar', err);
                }
                document.body.removeChild(textArea);
            };

            const downloadTxt = () => {
                if(!output) return;
                
                // Limpiar nombre para el archivo
                const safeFileName = (songTitle || 'cancion').replace(/[^a-z0-9]/gi, '_').toLowerCase();
                
                const element = document.createElement("a");
                const file = new Blob([output], {type: 'text/plain'});
                element.href = URL.createObjectURL(file);
                element.download = `${safeFileName}_acordeos.txt`;
                document.body.appendChild(element); 
                element.click();
                document.body.removeChild(element);
            };

            return (
                <div className="min-h-screen bg-black text-gray-100 flex flex-col font-sans">
                    {/* Header */}
                    <header className="flex items-center justify-center p-6 border-b border-gray-900 bg-gray950">
                        <WandIcon />
                        <h1 className="ml-3 text-2xl font-black tracking-tight text-white">
                            Traductor <span className="text-blue-500">AcordeOS</span>
                        </h1>
                    </header>

                    {/* Main Content */}
                    <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-8 flex flex-col lg:flex-row gap-6">
                        
                        {/* INPUT PANEL */}
                        <div className="flex-1 flex flex-col min-w-0">
                            <label className="text-sm font-bold text-gray-400 uppercase tracking-widest mb-3 flex items-center gap-2">
                                <span className="bg-gray-800 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs">1</span>
                                Formato Internet
                            </label>
                            <p className="text-xs text-gray-500 mb-4">Ingresa la información y pega la letra con los acordes arriba.</p>
                            
                            {/* Inputs de Título y Artista */}
                            <div className="flex gap-4 mb-4">
                                <div className="flex-1">
                                    <label className="block text-xs font-semibold text-gray-400 mb-1">TÍTULO</label>
                                    <input 
                                        type="text" 
                                        value={songTitle}
                                        onChange={(e) => setSongTitle(e.target.value)}
                                        placeholder="Ej. Lamento Boliviano"
                                        className="w-full bg-gray950 border border-gray-800 rounded-xl p-3 text-white font-sans text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-all shadow-inner"
                                    />
                                </div>
                                <div className="flex-1">
                                    <label className="block text-xs font-semibold text-gray-400 mb-1">ARTISTA</label>
                                    <input 
                                        type="text" 
                                        value={artist}
                                        onChange={(e) => setArtist(e.target.value)}
                                        placeholder="Ej. Enanitos Verdes"
                                        className="w-full bg-gray950 border border-gray-800 rounded-xl p-3 text-white font-sans text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-all shadow-inner"
                                    />
                                </div>
                            </div>

                            <textarea 
                                value={input}
                                onChange={(e) => setInput(e.target.value)}
                                placeholder="Pega aquí la canción (solo la letra y acordes)..."
                                className="flex-1 w-full bg-gray950 border border-gray-800 rounded-2xl p-5 text-gray-300 font-mono text-sm leading-relaxed focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none resize-none min-h-[200px] shadow-inner"
                                spellCheck="false"
                            />
                        </div>

                        {/* MIDDLE BUTTON (Mobile: Down, Desktop: Right) */}
                        <div className="flex items-center justify-center lg:py-16 shrink-0">
                            <button 
                                onClick={translateText}
                                className="group bg-blue-600 hover:bg-blue-500 active:scale-95 transition-all text-white font-bold py-4 px-8 rounded-2xl shadow-[0_0_30px_-5px_rgba(37,99,235,0.4)] flex flex-col items-center gap-2"
                            >
                                <span className="hidden lg:block group-hover:translate-x-1 transition-transform"><ArrowRightIcon /></span>
                                <span className="lg:hidden group-hover:translate-y-1 transition-transform"><ArrowDownIcon /></span>
                                Traducir
                            </button>
                        </div>

                        {/* OUTPUT PANEL */}
                        <div className="flex-1 flex flex-col min-w-0">
                            <label className="text-sm font-bold text-blue-500 uppercase tracking-widest mb-3 flex items-center gap-2">
                                <span className="bg-blue-900 text-blue-300 w-6 h-6 rounded-full flex items-center justify-center text-xs">2</span>
                                Formato AcordeOS
                            </label>
                            <p className="text-xs text-gray-500 mb-4">Acordes integrados y listos para tu biblioteca.</p>
                            <div className="relative flex-1 flex flex-col">
                                <textarea 
                                    value={output}
                                    readOnly
                                    placeholder="El resultado aparecerá aquí..."
                                    className="flex-1 w-full bg-black border border-gray-800 rounded-2xl p-5 text-white font-mono text-sm leading-relaxed outline-none resize-none min-h-[300px]"
                                    spellCheck="false"
                                />
                                
                                {/* Action Bar */}
                                {output && (
                                    <div className="absolute bottom-4 right-4 flex gap-2">
                                        <button 
                                            onClick={copyToClipboard}
                                            className="flex items-center gap-2 bg-gray-900 hover:bg-gray-800 border border-gray-700 text-white py-2 px-4 rounded-xl text-sm font-bold transition-colors active:scale-95"
                                        >
                                            {copied ? <span className="text-green-400">¡Copiado!</span> : <><CopyIcon /> Copiar</>}
                                        </button>
                                        <button 
                                            onClick={downloadTxt}
                                            className="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white py-2 px-4 rounded-xl text-sm font-bold transition-colors active:scale-95 shadow-lg"
                                        >
                                            <DownloadIcon /> .TXT
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>

                    </main>

                    {/* Footer instructions */}
                    <footer className="p-6 text-center text-xs text-gray-600 border-t border-gray-900">
                        AcordeOS Suite • Tema OLED Activado Exclusivamente
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
